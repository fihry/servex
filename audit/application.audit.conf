[global]
max_body_size = 1048576
timeout = 30
keep_alive = true

[error_pages]
400 = ./error_pages/400.html
403 = ./error_pages/403.html
404 = ./error_pages/404.html
405 = ./error_pages/405.html
413 = ./error_pages/413.html
500 = ./error_pages/500.html

[server:main]
server_name = localhost,test.com,blog.test,blog.local,127.0.0.1
host = 127.0.0.1
ports = 8080
root = ./www

[route:main:root]
path = /
methods = GET
index = index.html
autoindex = false

[route:main:ok]
path = /ok
methods = GET
root = ./www
index = ok
autoindex = false

[route:main:cgi]
path = /cgi-bin
methods = GET,POST
root = ./www/cgi-bin
cgi_extension = .py
cgi_executor = /usr/bin/python3

[route:main:temp]
path = /temp
redirect_status = 302
redirect_target = https://example.com

[route:main:uploads]
path = /uploads
methods = GET,POST,DELETE
upload_dir = ./www/uploads
autoindex = true
max_file_size = 5242880

[session]
enabled = true
timeout = 1800
cookie_name = LOCALSERVER_SESSION
secure = false
http_only = true
same_site = Lax
